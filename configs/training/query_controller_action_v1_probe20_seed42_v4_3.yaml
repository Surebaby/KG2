experiment:
  id: QUERY-CONTROLLER-ACTION-V1-PROBE20-SEED42-V4-3
  status: READY_FROZEN_V4_3_PROBE_ONLY
  phase: dedicated_query_controller_sft_probe
  primary_variable: observation_conditioned_single_query_action
  note: This probe is not a QA SFT, planner continuation, or KG-routing experiment.

data:
  schema_version: query-controller-action-v1
  train_path: data/silver_data/query_controller_actions_v1_seed42_v4_3/train.jsonl
  dev_path: data/silver_data/query_controller_actions_v1_seed42_v4_3/dev.jsonl
  allowed_source_actions: [text]
  require_all_records_selected: false
  quotas:
    train:
      2wikimultihopqa: {q1: 32, q2_dynamic: 32}
      musique: {q1: 32, q2_dynamic: 32}
    dev:
      2wikimultihopqa: {q1: 16, q2_dynamic: 16}
      musique: {q1: 16, q2_dynamic: 16}

# Fail closed until the append-only v4.3 protocol and release are frozen.
# The v4.2 config and its FAIL_STOP run remain immutable historical evidence.
