model:
  base_model: llama3-8B-instruct
  initialization: base_instruct
  init_adapter_path: null
  method: qlora
  load_in_4bit: true
  dtype: bf16
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  seed: 42
  max_seq_length: 1024
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  num_train_epochs: 1
  max_steps: 20
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  eval_strategy: "no"
  eval_steps: 20
  save_strategy: "no"
  save_steps: 20
  save_total_limit: 1
  verify_saved_adapter_reload: true
  output_dir: outputs/probes/query_controller_action_v1_probe20_seed42_v4_2

logging:
  report_to: [tensorboard]
  logging_dir: outputs/probes/query_controller_action_v1_probe20_seed42_v4_2/tensorboard

guardrails:
  assistant_only_ce: true
  target_truncation: forbidden
  exact_json_target: true
  final_answer_supervision: forbidden
  source_action_text_only: true
  confirmation_data: forbidden
  existing_output_reuse: forbidden
  gpu_launch_requires_human_approval: true
  formal_pilot_config: configs/training/query_controller_action_v1_pilot_seed42.yaml
  formal_pilot_output_dir: checkpoints/query_controller_action_v1_pilot_seed42
  formal_pilot_must_be_created_and_frozen_separately: true
