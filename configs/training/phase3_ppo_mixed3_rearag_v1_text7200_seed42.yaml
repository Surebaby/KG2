# Experiment ID: ppo_mixed3_rearag_v1_text7200_seed42
# Paper arm label: PPO-T
#
# Paired control arm (PPO-T): canonical EM/F1 outcome plus the frozen ReaRAG
# trajectory-level text reward.  The paired PPO-TK file changes only the output
# identity and proofkg_process_reward=true.  Both arms consume the same frozen
# 7,200-trajectory K=4 schedule.
includes:
  - phase3_ppo_legacy_repaired_v2_quota70_smoke600_combined_stability_v1.yaml

reward:
  # Fail hard: "rearag" may not fall back to an untracked head or dummy model.
  text_reward_backend: rearag

training:
  silver_path: data/silver_data/mixed_ppo_three_dataset_v1_n1799_k4_seed42/silver_train.jsonl
  output_dir: outputs/ppo_mixed3_rearag_v1_text7200_seed42
  sft_checkpoint: checkpoints/sft_legacy_repaired_v2_quota70_hard_seed42_no_text_head/final

  # This remains a HotpotQA anti-forgetting anchor.  It is identical in both
  # arms and never enters rollout prompts.
  sft_replay_silver_path: checkpoints/prm_alpha_gate_legacy_repaired_v2_quota70_hard_seed42_no_text_head/silver_with_logprobs.jsonl
  sft_replay_split: train

  # Identity-safe per-question records replace the legacy question-text index.
  question_kg_index_path: null
  question_kg_records_path: data/silver_data/mixed_ppo_three_dataset_v1_n1799_k4_seed42/question_kg_records.jsonl
  min_question_kg_record_coverage: 1.0
  require_nonempty_question_kg_records: false
  max_kg_index_miss_rate: 1.0
  require_exact_kg_index_alignment: false

  # The file is already a frozen train-only cohort; no second random split.
  split: null
  split_allow_none: true
  passage_overrides_path: null
  rollout_schedule_path: null
  rollout_sampling_weights_path: data/silver_data/mixed_ppo_three_dataset_v1_n1799_k4_seed42/sampling_weights.jsonl
  fixed_rollout_schedule_path: data/silver_data/mixed_ppo_three_dataset_v1_n1799_k4_seed42/fixed_rollout_schedule.jsonl

  # The mixed route bypasses the historical alpha gate and rule PRM.  ReaRAG
  # is enabled explicitly below and is the only text-process scorer.
  alpha_gate_path: null
  alpha_override: null
  max_input_length: 6144

  ppo:
    learning_rate: 1.0e-6
    batch_size: 4
    mini_batch_size: 1
    rollouts_per_prompt: 4
    rollout_chunk_size: 4
    ppo_epochs: 2

    total_ppo_steps: 7200
    save_every_steps: 600

    cliprange: 0.2
    cliprange_value: 0.2
    kl_coef: 0.25
    target_kl: 8.0
    kl_horizon: 2000.0
    gamma: 0.95
    lam: 0.95
    max_grad_norm: 1.0
    vf_coef: 0.5
    value_head_init: zero
    value_head_dropout: 0.0

    max_new_tokens: 384
    max_steps: 5
    ppo_max_passages: 15
    ppo_min_kg_triples: 1
    ppo_max_kg_triples: 12
    prm_min_subgraph_for_verify: 1
    temperature: 1.0
    top_p: 1.0

    # Frozen mixed reward:
    # invalid = -4;
    # valid PPO-T = 4*(max_alias canonical_EM + .1*max_alias canonical_F1)
    #             + .3*mean_t(clip(ReaRAG_t - causalEMA_preupdate, -1, 1)).
    # The aliases are frozen in each data row; EM and F1 independently take
    # their maxima over canonical-normalized unique answer surfaces.
    # The ReaRAG term is genuine step-level credit: for n valid steps, each
    # step-end receives .3/n times its centered/clipped score. Outcome and the
    # optional global ProofKG-v2.1 term are placed on the final generated token.
    pure_em_reward: false
    proofkg_outcome_only_reward: false
    mixed_outcome_reward: true
    mixed_text_reward: true
    outcome_weight: 4.0
    proofkg_f1_weight: 0.10
    text_reward_scale: 0.30
    center_text_reward: true
    text_baseline_momentum: 0.99

    # Kept identical in both arms; only the boolean below changes.
    proofkg_process_reward: false
    proofkg_process_version: v2_1
    proofkg_process_weight: 0.20
    proofkg_dynamic_validity: true
    proofkg_require_all_eligible: false

    min_valid_steps: 3
    min_reasoning_chars: 20
    shortfall_coef: 0.0
    target_steps: 3

    sft_replay_ratio: 0.10
    sft_anchor_weight: 0.10
    sft_anchor_interval: 0

    # Pre-registered cost/stability stops. Non-finite diagnostics fail
    # immediately in the runtime health guard.
    health_guard_after_steps: 200
    health_guard_window: 15
    health_guard_min_valid_rate: 0.70
    health_guard_max_length_capped_frac: 0.20
    health_guard_max_mean_kl: 10.0
    early_stopping: false
    log_with: tensorboard
